# Construit l'image Vikunja habillée Juste un suivi et la publie sur GHCR.
#
# VERSION porte la version de Vikunja et notre révision d'habillage :
# « 2.3.0-jus.1 » = Vikunja v2.3.0, habillage n° 1. Changer l'habillage sans
# changer de Vikunja : incrémenter le « jus.N ». Monter Vikunja : changer la
# partie amont et repartir à jus.1.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: v
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "amont=${VERSION%%-jus.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Récupérer Vikunja v${{ steps.v.outputs.amont }}
        run: git clone --depth 1 --branch "v${{ steps.v.outputs.amont }}" https://github.com/go-vikunja/vikunja.git vikunja

      # Échoue si une ancre a changé en amont : voir personnaliser.py.
      - name: Appliquer l'habillage
        run: python3 personnaliser.py vikunja

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile de Vikunja inchangé : seul le code qu'il compile a été habillé.
      - uses: docker/build-push-action@v6
        with:
          context: vikunja
          platforms: linux/amd64
          push: true
          build-args: RELEASE_VERSION=v${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Juste un suivi
            org.opencontainers.image.description=Vikunja ${{ steps.v.outputs.amont }} aux couleurs de Juste un suivi (le Juste Cloud)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
